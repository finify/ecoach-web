name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A project site is served from https://<owner>.github.io/<repo>/, so
        # the bundle needs that prefix. A <owner>.github.io repo serves from /.
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${GITHUB_REPOSITORY#*/}"  | tr '[:upper:]' '[:lower:]')
          if [ "$repo" = "$owner.github.io" ]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/$repo/"
          fi
          echo "Building with base path $BASE_PATH"
          npm run build

      - name: Add Pages helper files
        run: |
          touch dist/.nojekyll      # keep files starting with "_"
          # The catch-all route is prerendered to dist/404/index.html; GitHub
          # Pages serves dist/404.html for unknown URLs, so copy it into place.
          cp dist/404/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
